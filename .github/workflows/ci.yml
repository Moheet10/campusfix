name: CampusFix DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # Stage 1: Automated Testing & Validation
  # ==========================================
  unit-and-integration-tests:
    name: 🧪 Run Automated Pytest Suite (11 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytests & Generate JUnit Telemetry
        run: |
          pytest -v --junitxml=junit-report.xml

      - name: Archive Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-junit
          path: junit-report.xml

  # ==========================================
  # Stage 2: Multi-Stage Docker Validation
  # ==========================================
  docker-build-check:
    name: 🐳 Multi-Stage Docker Build & Hardening Check
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Tester Stage
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tester
          push: false

      - name: Build Hardened Production Stage (Non-Root Runner)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: false
          tags: campusfix-web:latest
