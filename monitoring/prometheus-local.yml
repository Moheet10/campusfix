global:
  scrape_interval: 3s
  evaluation_interval: 3s

scrape_configs:
  # Job 1: Prometheus Self Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Job 2: CampusFix Flask Application Metrics
  - job_name: 'campusfix-web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5000']
        labels:
          app: 'campusfix'
          environment: 'production'
