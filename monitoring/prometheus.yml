global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Job 1: Prometheus Self Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Job 2: CampusFix Flask Application Metrics
  - job_name: 'campusfix-web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:5000']
        labels:
          app: 'campusfix'
          environment: 'production'

  # Job 3: Node Exporter Server Metrics (Exp 7)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
