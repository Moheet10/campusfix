{% extends "base.html" %}

{% block title %}Sign In &bull; CampusFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="spotlight-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex mb-3">
                    <span class="crystal-tag"><i class="bi bi-shield-lock-fill"></i> PRISM ACCESS GATEWAY</span>
                </div>
                <h2 class="crystal-title fs-3 mb-2">Welcome Back</h2>
                <p class="text-secondary small">Authenticate to access telemetry, grievances & administrative controls</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(10, 18, 38, 0.95); color: #38bdf8; border: 1px solid rgba(147, 197, 253, 0.15); border-right: none;">
                            <i class="bi bi-person-badge"></i>
                        </span>
                        <input type="text" name="username" id="loginUsername" class="form-control" placeholder="e.g. student1 or admin" required autofocus style="border-left: none;">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(10, 18, 38, 0.95); color: #38bdf8; border: 1px solid rgba(147, 197, 253, 0.15); border-right: none;">
                            <i class="bi bi-key-fill"></i>
                        </span>
                        <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" required style="border-left: none;">
                    </div>
                </div>

                <button type="submit" class="btn btn-crystal-primary w-100 py-3 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                </button>
            </form>

            <!-- Quick Auto-Fill Buttons for Viva/Demo -->
            <div class="pt-3 border-top" style="border-color: rgba(147, 197, 253, 0.1) !important;">
                <div class="text-secondary small text-center mb-2 font-monospace" style="font-size: 0.74rem; letter-spacing: 0.05em;">
                    <i class="bi bi-lightning-charge text-warning"></i> 1-CLICK DEMO CREDENTIALS:
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-crystal-secondary btn-sm w-50 small" onclick="document.getElementById('loginUsername').value='admin'; document.getElementById('loginPassword').value='admin123';">
                        <i class="bi bi-shield-shaded text-danger me-1"></i> Admin Demo
                    </button>
                    <button type="button" class="btn btn-crystal-secondary btn-sm w-50 small" onclick="document.getElementById('loginUsername').value='student1'; document.getElementById('loginPassword').value='password123';">
                        <i class="bi bi-mortarboard text-info me-1"></i> Student Demo
                    </button>
                </div>
            </div>

            <div class="text-center mt-4 small text-secondary">
                New resident or student? <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
