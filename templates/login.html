{% extends "base.html" %}

{% block title %}Sign In &bull; CampusFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="spotlight-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 52px; height: 52px; background: rgba(99, 102, 241, 0.15); color: #818cf8;">
                    <i class="bi bi-shield-lock fs-3"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to manage campus complaints & telemetry</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(15, 23, 42, 0.9); color: #818cf8;">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" id="loginUsername" class="form-control" placeholder="e.g. student1 or admin" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(15, 23, 42, 0.9); color: #818cf8;">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-glow-primary w-100 py-3 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                </button>
            </form>

            <!-- Quick Auto-Fill Buttons for Viva/Demo -->
            <div class="pt-3 border-top" style="border-color: rgba(255, 255, 255, 0.08) !important;">
                <div class="text-muted small text-center mb-2" style="font-size: 0.75rem;">1-Click Demo Fill:</div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary w-50 small" onclick="document.getElementById('loginUsername').value='admin'; document.getElementById('loginPassword').value='admin123';">
                        <i class="bi bi-shield-shaded text-danger me-1"></i> Fill Admin
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary w-50 small" onclick="document.getElementById('loginUsername').value='student1'; document.getElementById('loginPassword').value='password123';">
                        <i class="bi bi-mortarboard text-success me-1"></i> Fill Student
                    </button>
                </div>
            </div>

            <div class="text-center mt-4 small text-muted">
                New resident or student? <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
