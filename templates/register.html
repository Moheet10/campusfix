{% extends "base.html" %}

{% block title %}Register &bull; CampusFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="spotlight-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 52px; height: 52px; background: rgba(16, 185, 129, 0.15); color: #34d399;">
                    <i class="bi bi-person-plus fs-3"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Create Student Account</h3>
                <p class="text-muted small">Register to report grievances and track resolution</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(15, 23, 42, 0.9); color: #34d399;">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" class="form-control" placeholder="Choose a unique username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(15, 23, 42, 0.9); color: #34d399;">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <small class="text-muted mt-1 d-block" style="font-size: 0.75rem;">
                        <i class="bi bi-shield-check text-info me-1"></i> Passwords are salted and hashed with PBKDF2/SHA-256.
                    </small>
                </div>

                <button type="submit" class="btn btn-glow-primary w-100 py-3 mb-3">
                    <i class="bi bi-check-circle me-1"></i> Create Student Account
                </button>
            </form>

            <div class="text-center mt-3 small text-muted">
                Already registered? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-semibold">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
