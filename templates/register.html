{% extends "base.html" %}

{% block title %}Register - CampusFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold text-center mb-4">Create Account</h3>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Role</label>
                        <select name="role" class="form-select">
                            <option value="student" selected>Student / Resident</option>
                            <option value="admin">Administrator / Faculty</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Register</button>
                </form>
                <div class="text-center mt-3 small text-muted">
                    Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
